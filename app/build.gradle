plugins { id 'com.android.application' }

android {
    namespace 'com.marinevhf'
    compileSdk 34

    defaultConfig {
        applicationId 'com.marinevhf.vhf'
        minSdk 26            // Android 8.0: Redmi 9 вышел с Android 10, запас с избытком
        targetSdk 34
        versionCode 1
        versionName '2.0'
    }

    signingConfigs {
        release {
            storeFile file('keystore/marinevhf.jks')
            storePassword 'marinevhf'
            keyAlias 'marinevhf'
            keyPassword 'marinevhf'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug { signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress 'apk'     // драйвер лежит в assets как есть
    }
    lint { abortOnError false }
}
