name: Build APK
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.5 }
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Fetch RTL-SDR driver (bundled into the APK)
        run: bash scripts/fetch_driver.sh
      - name: Build
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MarineVHF-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish APK to branch apk-latest
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/release/*.apk /tmp/out/MarineVHF.apk
          cd /tmp/out && git init -q -b apk-latest && git add . 
          git -c user.name=ci -c user.email=ci@example.com commit -qm "APK $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-latest
